# Deploys the widget/ folder (the Town Council meeting summaries widget) to GitHub Pages
# whenever it changes on main, including each time the dashboard app publishes new summaries.
name: Deploy Oro Valley council widget

on:
  push:
    branches: [main]
    paths: ["widget/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: widget
      - id: deployment
        uses: actions/deploy-pages@v4
