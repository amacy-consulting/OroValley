<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Town Council Meetings</title>
    <meta name="description" content="Summaries of recent Town of Oro Valley Town Council meetings." />
    <!-- The Town site's own typeface, loaded from the same place orovalleyaz.gov loads it -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:400,600,700&amp;display=swap" />
    <link rel="stylesheet" href="widget.css" />
    <script type="module" src="widget.js"></script>
  </head>
  <body>
    <main class="ecw" id="ecw" aria-live="polite">
      <!-- Not shown; names the widget for screen readers. -->
      <h1 class="ecw-sr">Town Council meeting summaries</h1>
      <div id="ecw-content">
        <p class="ecw-status">Loading meeting summaries…</p>
        <noscript>
          <p class="ecw-status">
            <a href="https://www.orovalleyaz.gov/Government/Departments/Town-Clerk/Meetings-and-Agendas" target="_blank" rel="noopener">
              View agendas, minutes, and meeting video
            </a>
          </p>
        </noscript>
      </div>
